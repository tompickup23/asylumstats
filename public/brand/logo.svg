<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 80" fill="none">
  <!-- Asylum Stats — Primary Horizontal Logo
       Radar/scanner icon with data sweep + wordmark.
       Concentric circles = tracking. Sweep line = active monitoring.
       Data dots = the 147 areas, the 13K observations. -->
  <defs>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="radar-clip">
      <circle cx="40" cy="40" r="30"/>
    </clipPath>
  </defs>

  <!-- Radar rings -->
  <circle cx="40" cy="40" r="30" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.3"/>
  <circle cx="40" cy="40" r="20" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.2"/>
  <circle cx="40" cy="40" r="10" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.15"/>

  <!-- Radar sweep (pie wedge) -->
  <g clip-path="url(#radar-clip)">
    <path d="M40,40 L40,10 A30,30 0 0,1 65,55 Z" fill="url(#sweep)"/>
  </g>

  <!-- Crosshair lines -->
  <line x1="40" y1="8" x2="40" y2="72" stroke="#06b6d4" stroke-width="0.6" opacity="0.2"/>
  <line x1="8" y1="40" x2="72" y2="40" stroke="#06b6d4" stroke-width="0.6" opacity="0.2"/>

  <!-- Data blips (detected locations) -->
  <circle cx="52" cy="28" r="2.5" fill="#f59e0b"/>
  <circle cx="33" cy="48" r="2" fill="#06b6d4"/>
  <circle cx="48" cy="45" r="1.8" fill="#06b6d4" opacity="0.7"/>
  <circle cx="28" cy="32" r="1.5" fill="#10b981"/>
  <circle cx="55" cy="38" r="1.8" fill="#f59e0b" opacity="0.7"/>

  <!-- Centre dot -->
  <circle cx="40" cy="40" r="2" fill="#06b6d4"/>

  <!-- Outer ring (bold) -->
  <circle cx="40" cy="40" r="32" fill="none" stroke="#06b6d4" stroke-width="2.5"/>

  <!-- Wordmark -->
  <text x="90" y="33" font-family="'Manrope', Inter, -apple-system, system-ui, sans-serif" font-size="28" font-weight="800" letter-spacing="-0.5" fill="#f5f7fb">
    ASYLUM
  </text>
  <text x="90" y="60" font-family="'Manrope', Inter, -apple-system, system-ui, sans-serif" font-size="22" font-weight="400" letter-spacing="4" fill="#91a7c4">
    STATS
  </text>

  <!-- Accent underline -->
  <rect x="90" y="66" width="100" height="2" rx="1" fill="#06b6d4"/>

  <!-- Tagline (optional, for wide placements) -->
  <text x="250" y="48" font-family="'Manrope', Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#91a7c4" letter-spacing="1">
    UK ASYLUM ACCOUNTABILITY
  </text>
</svg>

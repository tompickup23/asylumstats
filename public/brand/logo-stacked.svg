<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" fill="none">
  <!-- Asylum Stats — Stacked Logo (square, for social avatars) -->
  <defs>
    <linearGradient id="sw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="rc"><circle cx="100" cy="80" r="48"/></clipPath>
  </defs>

  <!-- Background -->
  <rect width="200" height="220" rx="20" fill="#04070d"/>

  <!-- Radar -->
  <circle cx="100" cy="80" r="50" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <circle cx="100" cy="80" r="34" fill="none" stroke="#06b6d4" stroke-width="1" opacity="0.25"/>
  <circle cx="100" cy="80" r="18" fill="none" stroke="#06b6d4" stroke-width="0.8" opacity="0.15"/>

  <g clip-path="url(#rc)">
    <path d="M100,80 L100,30 A50,50 0 0,1 140,112 Z" fill="url(#sw)"/>
  </g>

  <line x1="100" y1="28" x2="100" y2="132" stroke="#06b6d4" stroke-width="0.6" opacity="0.2"/>
  <line x1="48" y1="80" x2="152" y2="80" stroke="#06b6d4" stroke-width="0.6" opacity="0.2"/>

  <circle cx="120" cy="56" r="3.5" fill="#f59e0b"/>
  <circle cx="82" cy="100" r="3" fill="#06b6d4"/>
  <circle cx="118" cy="96" r="2.5" fill="#06b6d4" opacity="0.6"/>
  <circle cx="76" cy="64" r="2.5" fill="#10b981"/>
  <circle cx="100" cy="80" r="3" fill="#06b6d4"/>

  <!-- Text -->
  <text x="100" y="162" text-anchor="middle" font-family="'Manrope', Inter, system-ui, sans-serif" font-size="26" font-weight="800" fill="#f5f7fb">ASYLUM</text>
  <text x="100" y="186" text-anchor="middle" font-family="'Manrope', Inter, system-ui, sans-serif" font-size="18" font-weight="400" letter-spacing="5" fill="#91a7c4">STATS</text>

  <!-- Accent -->
  <rect x="60" y="194" width="80" height="2" rx="1" fill="#06b6d4"/>

  <!-- Tagline -->
  <text x="100" y="212" text-anchor="middle" font-family="'Manrope', Inter, system-ui, sans-serif" font-size="8" font-weight="500" fill="#91a7c4" letter-spacing="2">UK ASYLUM ACCOUNTABILITY</text>
</svg>

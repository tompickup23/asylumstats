name: Site checks

on:
  pull_request:
  # Also on pushes to main, because the refresh workflow commits data straight to main
  # and deploys it without any of these checks running. main failed regional-source-watch
  # from 4 September and no run existed to say so; an xlsx upgrade broke six transforms
  # the day before and the only red was a workflow nobody was watching. A PR-only trigger
  # validates the code and never the thing that actually changes most often, which is the
  # data. This does not block the deploy — deploy.yml is a separate workflow — it just
  # means main going red is visible instead of silent.
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - env:
          BUILD_OG: "1"
        run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

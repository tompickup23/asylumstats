name: Refresh data

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

# The job commits and pushes refreshed data back to main, so the workflow
# token needs contents: write. Without this it defaults to read-only and
# the final `git push` fails with 403.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tribunals must run before routes: the route dashboard's appeals block is built from
      # src/data/live/tribunal-appeals.json, so routes needs the refreshed file already on disk.
      - name: Fetch and transform MOJ tribunals
        run: npm run ingest:tribunals
      - name: Fetch and transform routes
        run: npm run ingest:routes
      - name: Fetch and transform regional sources
        run: npm run ingest:regionalsources
      - name: Fetch and transform hotels
        run: npm run ingest:hotels
      - name: Transform money ledger
        run: npm run ingest:money
      # Runs after the ingests so a fetch failure does not mask a stale source, and
      # the date is passed in rather than read inside the script so a local run of the
      # same commit gives the same answer. No GitHub event data is interpolated here.
      - name: Check source freshness
        run: node scripts/audit/source-freshness.mjs "$(date -u +%F)"

      # Link rot, checked weekly rather than on every push, because it depends on other
      # people's servers being up. Advisory: a flaky external host must not fail the data
      # refresh. This exists because the most prominent figure on the homepage, the
      # £5.77M a day hotel cost, linked to a Home Office factsheet that had been taken
      # down, and nothing noticed. No GitHub event data is interpolated here.
      - name: Check source links resolve
        continue-on-error: true
        run: npm run audit:links

      # Ignore run timestamps when deciding whether anything changed.
      #
      # Six transforms stamp `generatedAt`/`generated_at` with new Date() into committed
      # artefacts. Those move on every run whether or not a single figure did, so
      # `git diff --quiet` was always false and this workflow committed every Monday
      # regardless. That buries a real data change in a stream of identical ones and
      # makes the history useless for answering "when did this number last move".
      #
      # So the comparison drops timestamp-only lines. A diff that is nothing but
      # generatedAt is not a data change. No GitHub event data is interpolated here.
      - name: Check for data changes
        id: changes
        run: |
          substantive=$(git diff -U0 src/data/live/ data/marts/ data/canonical/ data/raw/manifests/ \
            | grep -E '^[+-]' \
            | grep -Ev '^(\+\+\+|---)' \
            | grep -Ev '"(generatedAt|generated_at)"' \
            || true)
          if [ -n "$substantive" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Substantive data changes found:"
            echo "$substantive" | head -40
          else
            echo "Only run timestamps moved. Nothing to commit."
          fi
      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/live/ data/marts/ data/canonical/ data/raw/manifests/
          git commit -m "data: refresh tribunal + route + hotel + money data $(date -u +%Y-%m-%d)"
          git push

      # Last, and strict: the data above has already been committed, so this only
      # decides whether the run ends loudly. Every stale item found on 13 Aug 2026 had
      # slipped past this cron precisely because nothing compared next-edition dates
      # against today.
      - name: Fail if a source is past its next edition
        run: node scripts/audit/source-freshness.mjs "$(date -u +%F)" --strict

name: Refresh data

on:
  schedule:
    # Monday morning, the standing refresh.
    - cron: "0 8 * * 1"
    # Thursday lunchtime, for the quarterly. The Home Office publishes the whole asylum
    # corpus at 09:30 on the last Thursday of February, May, August and November, and a
    # Monday-only cron leaves the site showing the previous quarter for up to four days
    # after the release it is meant to be reporting. 12:00 UTC clears the 08:30 UTC
    # publication with hours to spare, and on the other fifty weeks of the year the run
    # finds nothing new and commits nothing.
    - cron: "0 12 * * 4"
    # And again at 16:00 UTC, because GitHub schedules are best effort and this repo's
    # are routinely late: 54 minutes on 24 August, 72 on 10 August, 195 on 3 August.
    # On 27 August, the morning of a Home Office quarterly, the 12:00 run had still not
    # started three hours later and the refresh had to be dispatched by hand.
    #
    # A duplicate run is harmless. "Check for data changes" already compares substantive
    # content and skips the commit when only run timestamps moved, so if the earlier run
    # did land this one costs a few minutes of runner time and commits nothing.
    - cron: "0 16 * * 4"
  workflow_dispatch:

# The job commits and pushes refreshed data back to main, so the workflow
# token needs contents: write. Without this it defaults to read-only and
# the final `git push` fails with 403. actions: write is for the deploy
# dispatch at the end; see the comment on that step.
permissions:
  contents: write
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tribunals must run before routes: the route dashboard's appeals block is built from
      # src/data/live/tribunal-appeals.json, so routes needs the refreshed file already on disk.
      - name: Fetch and transform MOJ tribunals
        run: npm run ingest:tribunals
      - name: Fetch and transform routes
        run: npm run ingest:routes
      # Small boats was missing from this workflow entirely, which is why the site's most
      # newsworthy weekly figure could only ever go stale: the Home Office publishes it on
      # Fridays, this runs on Mondays, and nothing here fetched it. It sat seventeen days
      # behind its own ten-day limit until 23 August, when it was refreshed by hand.
      # No GitHub event data is interpolated here.
      - name: Fetch and transform small boats
        run: npm run ingest:smallboats

      # asylum-finance derives its numeric facts from the routes mart, so it runs after
      # routes and needs no network of its own. It was overdue for four days for the
      # same reason ingest:hospend nearly was: the script existed, package.json knew
      # about it, and no workflow ever called it. A generator nothing runs is a stale
      # dataset with extra steps.
      #
      # continue-on-error for the same reason as the others: it sits before the commit,
      # and a failure here must not cost the datasets that already fetched cleanly.
      # No GitHub event data is interpolated here.
      - name: Refresh asylum finance facts
        id: asylumfinance
        continue-on-error: true
        run: npm run transform:asylumfinance
      # Hotels must run before money: the money ledger is built on top of the hotel entity
      # ledger it produces. That dependency was undeclared and only surfaced when this
      # workflow was reordered, because until then the job always died at regional sources
      # before either of them ran.
      # Hotels is a Wayback snapshot of a third-party site, so it is secondary in exactly
      # the way regional sources is: colour around the Home Office figures, not the figures.
      # On 27 August 2026 web.archive.org was unreachable and this step aborted the run
      # after routes, tribunals and small boats had already succeeded, so the commit, push
      # and deploy below were all skipped and the site kept serving the previous quarter on
      # the morning of a Home Office release. Money reads the committed hotel mart rather
      # than this fetch, so it still runs when this is skipped.
      # No GitHub event data is interpolated here.
      - name: Fetch and transform hotels
        id: hotels
        continue-on-error: true
        run: npm run ingest:hotels
      - name: Transform money ledger
        run: npm run ingest:money

      # Home Office spend over £25,000, which is the ledger behind
      # /what-the-home-office-publishes. The department publishes monthly, so a weekly
      # run catches every release with room to spare.
      #
      # This one re-downloads the whole corpus every run, because data/raw/ho_spend is
      # gitignored and a CI checkout starts empty. That makes a PARTIAL download the
      # failure mode to worry about: the transform would parse whatever arrived, report
      # a tidy "180/180 files parsed" and commit a mart missing a third of the money,
      # and nothing downstream would look broken because the smaller number is
      # internally consistent. transform-ho-spend refuses to write a mart smaller than
      # the one already committed and exits 1, so a truncated fetch fails the step
      # instead of quietly rewriting the site's headline figure.
      #
      # continue-on-error, despite being Home Office data rather than colour, and the
      # reason is the ordering rather than the importance. This step sits BEFORE the
      # commit, so aborting here would take tribunals, routes, small boats and money
      # down with it and nothing would refresh at all — the exact failure this workflow
      # already learned twice, from hotels on 27 August and regional sources on 17
      # August. GOV.UK being unreachable must not cost the datasets that did fetch.
      #
      # The run still ends red: the outcome is checked in the secondary gate at the
      # bottom, after the good data is safely committed and deployed.
      # No GitHub event data is interpolated here.
      - name: Fetch and transform Home Office spend
        id: hospend
        continue-on-error: true
        run: npm run ingest:hospend

      # Regional partner pages, and the one ingest allowed to fail without taking the Home
      # Office data with it. On 17 August a single unreachable host, www.wsmp.wales, hung
      # for 133 seconds and then aborted the whole job, so tribunals, routes and money never
      # reached the commit step below and nothing on the site refreshed. This is colour
      # around the national figures; it is not worth the national figures. A failure here
      # still ends the run red, at the bottom, once the core data is safely committed.
      # No GitHub event data is interpolated here.
      - name: Fetch and transform regional sources
        id: regional
        continue-on-error: true
        run: npm run ingest:regionalsources
      # Runs after the ingests so a fetch failure does not mask a stale source, and
      # the date is passed in rather than read inside the script so a local run of the
      # same commit gives the same answer. No GitHub event data is interpolated here.
      - name: Check source freshness
        run: node scripts/audit/source-freshness.mjs "$(date -u +%F)"

      # Link rot, checked weekly rather than on every push, because it depends on other
      # people's servers being up. Advisory: a flaky external host must not fail the data
      # refresh. This exists because the most prominent figure on the homepage, the
      # £5.77M a day hotel cost, linked to a Home Office factsheet that had been taken
      # down, and nothing noticed. No GitHub event data is interpolated here.
      - name: Check source links resolve
        continue-on-error: true
        run: npm run audit:links

      # Ignore run timestamps when deciding whether anything changed.
      #
      # Six transforms stamp `generatedAt`/`generated_at` with new Date() into committed
      # artefacts. Those move on every run whether or not a single figure did, so
      # `git diff --quiet` was always false and this workflow committed every Monday
      # regardless. That buries a real data change in a stream of identical ones and
      # makes the history useless for answering "when did this number last move".
      #
      # So the comparison drops timestamp-only lines. A diff that is nothing but
      # generatedAt is not a data change. No GitHub event data is interpolated here.
      - name: Check for data changes
        id: changes
        run: |
          substantive=$(git diff -U0 src/data/live/ data/marts/ data/canonical/ data/raw/manifests/ \
            | grep -E '^[+-]' \
            | grep -Ev '^(\+\+\+|---)' \
            | grep -Ev '"(generatedAt|generated_at)"' \
            || true)
          if [ -n "$substantive" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Substantive data changes found:"
            echo "$substantive" | head -40
          else
            echo "Only run timestamps moved. Nothing to commit."
          fi
      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/live/ data/marts/ data/canonical/ data/raw/manifests/

          # A refresh adds and updates. It does not delete.
          #
          # On 24 August 2026 this step committed the deletion of 11 files and 18,643
          # lines from data/canonical/regional_sources/, including a 12,216-line supported
          # area series. Nothing was wrong with the data: www.wsmp.wales was unreachable,
          # the regional ingest is continue-on-error so the run went on, and `git add`
          # dutifully staged the absence of everything that ingest had not written. The
          # commit read as a routine data refresh and the files were gone from main for
          # three days before anyone looked.
          #
          # Deleting canonical data is a deliberate act and belongs in a human commit.
          # No GitHub event data is interpolated here.
          deleted="$(git diff --cached --diff-filter=D --name-only -- data/canonical/ src/data/live/ data/marts/)"
          if [ -n "$deleted" ]; then
            echo "Refusing to commit: this refresh would DELETE committed data."
            echo "$deleted"
            echo "A failed or partial ingest cannot be allowed to remove files."
            exit 1
          fi

          git commit -m "data: refresh tribunal + route + small boats + hotel + money data $(date -u +%Y-%m-%d)"
          git push

      # Ask for a deploy, because the push above will not produce one.
      #
      # GitHub does not raise workflow events for pushes made with the default
      # GITHUB_TOKEN, which exists to stop workflows triggering themselves forever. The
      # side effect here is that this job could commit fresh Home Office data to main and
      # the live site would keep serving the old data until some unrelated human push
      # happened along. On a quarterly release day that is the whole point of the run,
      # lost. Dispatching deploy.yml explicitly is the documented way round it.
      # No GitHub event data is interpolated here.
      - name: Deploy the refreshed data
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --ref main

      # Last, and strict: the data above has already been committed, so this only
      # decides whether the run ends loudly. Every stale item found on 13 Aug 2026 had
      # slipped past this cron precisely because nothing compared next-edition dates
      # against today.
      - name: Fail if a source is past its next edition
        run: node scripts/audit/source-freshness.mjs "$(date -u +%F)" --strict

      # Same principle as the gate above: the core data has already been committed, so this
      # only decides whether the run ends red. `always()` so a stale source and a dead
      # regional host both get reported rather than the first one hiding the second.
      # Reads step outcomes only; no GitHub event data is interpolated here.
      - name: Fail if a secondary source was skipped
        if: always()
        env:
          REGIONAL_OUTCOME: ${{ steps.regional.outcome }}
          HOTELS_OUTCOME: ${{ steps.hotels.outcome }}
          HOSPEND_OUTCOME: ${{ steps.hospend.outcome }}
          ASYLUMFINANCE_OUTCOME: ${{ steps.asylumfinance.outcome }}
        run: |
          skipped=""
          if [ "$REGIONAL_OUTCOME" = "failure" ]; then
            skipped="$skipped regional-sources"
          fi
          if [ "$HOTELS_OUTCOME" = "failure" ]; then
            skipped="$skipped hotels"
          fi
          if [ "$HOSPEND_OUTCOME" = "failure" ]; then
            skipped="$skipped home-office-spend"
          fi
          if [ "$ASYLUMFINANCE_OUTCOME" = "failure" ]; then
            skipped="$skipped asylum-finance"
          fi
          if [ -n "$skipped" ]; then
            echo "Ingest failed:$skipped"
            # Do not claim the Home Office data refreshed when it may be the thing that
            # failed. Say which datasets are stale and which are not.
            if [ "$HOSPEND_OUTCOME" = "failure" ]; then
              echo "Home Office spend did NOT refresh. /what-the-home-office-publishes"
              echo "and the ledger on /spending are serving the previously committed mart,"
              echo "which is correct but now older than the date the page advertises."
            else
              echo "The Home Office data refreshed and was committed."
            fi
            exit 1
          fi
          echo "All ingests completed."

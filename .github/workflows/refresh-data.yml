name: Refresh data

on:
  schedule:
    # Monday morning, the standing refresh.
    - cron: "0 8 * * 1"
    # Thursday lunchtime, for the quarterly. The Home Office publishes the whole asylum
    # corpus at 09:30 on the last Thursday of February, May, August and November, and a
    # Monday-only cron leaves the site showing the previous quarter for up to four days
    # after the release it is meant to be reporting. 12:00 UTC clears the 08:30 UTC
    # publication with hours to spare, and on the other fifty weeks of the year the run
    # finds nothing new and commits nothing.
    - cron: "0 12 * * 4"
  workflow_dispatch:

# The job commits and pushes refreshed data back to main, so the workflow
# token needs contents: write. Without this it defaults to read-only and
# the final `git push` fails with 403.
permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tribunals must run before routes: the route dashboard's appeals block is built from
      # src/data/live/tribunal-appeals.json, so routes needs the refreshed file already on disk.
      - name: Fetch and transform MOJ tribunals
        run: npm run ingest:tribunals
      - name: Fetch and transform routes
        run: npm run ingest:routes
      # Small boats was missing from this workflow entirely, which is why the site's most
      # newsworthy weekly figure could only ever go stale: the Home Office publishes it on
      # Fridays, this runs on Mondays, and nothing here fetched it. It sat seventeen days
      # behind its own ten-day limit until 23 August, when it was refreshed by hand.
      # No GitHub event data is interpolated here.
      - name: Fetch and transform small boats
        run: npm run ingest:smallboats
      - name: Transform money ledger
        run: npm run ingest:money

      # Secondary context, and allowed to fail without taking the Home Office data with it.
      # On 17 August one unreachable host, www.wsmp.wales, hung for 133 seconds and then
      # aborted the whole job, so tribunals, routes and money never reached the commit step
      # below and nothing on the site refreshed. Regional partner pages are colour around
      # the national figures; they are not worth the national figures. A failure here still
      # ends the run loudly, at the bottom, once the core data is safely committed.
      # No GitHub event data is interpolated here.
      - name: Fetch and transform regional sources
        id: regional
        continue-on-error: true
        run: npm run ingest:regionalsources
      - name: Fetch and transform hotels
        id: hotels
        continue-on-error: true
        run: npm run ingest:hotels
      # Runs after the ingests so a fetch failure does not mask a stale source, and
      # the date is passed in rather than read inside the script so a local run of the
      # same commit gives the same answer. No GitHub event data is interpolated here.
      - name: Check source freshness
        run: node scripts/audit/source-freshness.mjs "$(date -u +%F)"

      # Link rot, checked weekly rather than on every push, because it depends on other
      # people's servers being up. Advisory: a flaky external host must not fail the data
      # refresh. This exists because the most prominent figure on the homepage, the
      # £5.77M a day hotel cost, linked to a Home Office factsheet that had been taken
      # down, and nothing noticed. No GitHub event data is interpolated here.
      - name: Check source links resolve
        continue-on-error: true
        run: npm run audit:links

      # Ignore run timestamps when deciding whether anything changed.
      #
      # Six transforms stamp `generatedAt`/`generated_at` with new Date() into committed
      # artefacts. Those move on every run whether or not a single figure did, so
      # `git diff --quiet` was always false and this workflow committed every Monday
      # regardless. That buries a real data change in a stream of identical ones and
      # makes the history useless for answering "when did this number last move".
      #
      # So the comparison drops timestamp-only lines. A diff that is nothing but
      # generatedAt is not a data change. No GitHub event data is interpolated here.
      - name: Check for data changes
        id: changes
        run: |
          substantive=$(git diff -U0 src/data/live/ data/marts/ data/canonical/ data/raw/manifests/ \
            | grep -E '^[+-]' \
            | grep -Ev '^(\+\+\+|---)' \
            | grep -Ev '"(generatedAt|generated_at)"' \
            || true)
          if [ -n "$substantive" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Substantive data changes found:"
            echo "$substantive" | head -40
          else
            echo "Only run timestamps moved. Nothing to commit."
          fi
      - name: Commit and push updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/live/ data/marts/ data/canonical/ data/raw/manifests/
          git commit -m "data: refresh tribunal + route + small boats + hotel + money data $(date -u +%Y-%m-%d)"
          git push

      # Last, and strict: the data above has already been committed, so this only
      # decides whether the run ends loudly. Every stale item found on 13 Aug 2026 had
      # slipped past this cron precisely because nothing compared next-edition dates
      # against today.
      - name: Fail if a source is past its next edition
        run: node scripts/audit/source-freshness.mjs "$(date -u +%F)" --strict

      # Same principle as the gate above: the core data has already been committed, so this
      # only decides whether the run ends red. `always()` so a stale source and a dead
      # regional host both get reported rather than the first one hiding the second.
      # Reads step outcomes only; no GitHub event data is interpolated here.
      - name: Fail if a secondary source was skipped
        if: always()
        env:
          REGIONAL_OUTCOME: ${{ steps.regional.outcome }}
          HOTELS_OUTCOME: ${{ steps.hotels.outcome }}
        run: |
          skipped=""
          if [ "$REGIONAL_OUTCOME" = "failure" ]; then
            skipped="$skipped regional-sources"
          fi
          if [ "$HOTELS_OUTCOME" = "failure" ]; then
            skipped="$skipped hotels"
          fi
          if [ -n "$skipped" ]; then
            echo "Secondary ingest failed:$skipped"
            echo "The Home Office data still refreshed and was committed."
            exit 1
          fi
          echo "Secondary ingests completed."

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      # refresh-data.yml dispatches this workflow after committing new figures, and that
      # deploy changes real pages, so it should announce them. A hand-run rehearsal should
      # not, which is why the default is false.
      announce:
        description: "Notify IndexNow of changed URLs"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # Pinned, not ubuntu-latest: the desktop layout spec compares screenshots pixel for
    # pixel, and a runner OS change moves font rendering under every baseline at once.
    # Move deliberately, with update-desktop-baselines.yml on the same image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - env:
          BUILD_OG: "1"
        run: npm run build
      # The support-vs-accommodation guards read dist/places, so they are skipIf(!built)
      # and `npm test` above runs before the build. That means both of them, the two
      # checks written because a place page and a Facebook post had each called people
      # on asylum support "housed" when the number accommodated was zero, had never once
      # run in CI. They only ever fired for whoever happened to have a local dist, and a
      # stale one at that. Running them here is the whole point of having them.
      # No GitHub event data is interpolated here.
      # The run-on guard belongs here for the same reason: it reads dist and the defect
      # it looks for is created by the compiler, so it cannot be seen before the build.
      # No GitHub event data is interpolated here.
      - name: Guards that need the built site
        run: npx vitest run tests/support-vs-accommodation.test.ts tests/rendered-text-runons.test.ts tests/rendered-text-dashes.test.ts tests/datasets.test.ts tests/internal-links.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
      - run: npm run test:desktop
      # Behaviour, not layout. The two homepage lookups shipped broken and no suite drove
      # them: the Playwright matcher only picked up specs named for layout, so a spec for
      # anything else would never have run.
      - run: npm run test:search
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
      # Before the upload, because this compares the sitemap just built against the one
      # the live site is still serving, and submits only the URLs that are new or whose
      # lastmod moved. After the deploy that comparison is against itself and reports
      # nothing. Notifying a minute before the content lands is fine: IndexNow queues.
      # Runs on a push to main, and on a dispatch that asks for it (the data refresh does,
      # since until 7 October 2026 a quarterly release changed hundreds of pages and told
      # no search engine). A plain workflow_dispatch rehearsal announces nothing.
      # No GitHub event data is interpolated here.
      # continue-on-error because telling a search engine about a change is an
      # optimisation and the deploy is not. This step failing once already held the
      # whole site back from going live, which is the wrong trade in every case.
      - name: Notify IndexNow of changed canonical URLs
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.announce)
        continue-on-error: true
        env:
          INDEXNOW_SUBMIT: "1"
        run: node scripts/indexnow-submit.mjs --changed

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # A failed deploy leaves the live site on the previous build, which looks fine from
  # outside. From 1 to 7 October 2026 every deploy failed and nobody was told for nine
  # days. This opens one issue per run of failures, and comments on it after that.
  # Reads run metadata only; no GitHub event data is interpolated here.
  report-failure:
    needs: [build, deploy]
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create deploy-failed --color B60205 --description "The live site did not update" --force
          open="$(gh issue list --label deploy-failed --state open --json number --jq '.[0].number')"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "Failed again: $RUN_URL"
          else
            gh issue create --label deploy-failed \
              --title "Deploy failed: the live site is not updating" \
              --body "The deploy failed and the live site is still serving the previous build. Run: $RUN_URL. Close this issue once a deploy succeeds."
          fi

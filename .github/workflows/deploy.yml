name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - env:
          BUILD_OG: "1"
        run: npm run build
      # The support-vs-accommodation guards read dist/places, so they are skipIf(!built)
      # and `npm test` above runs before the build. That means both of them, the two
      # checks written because a place page and a Facebook post had each called people
      # on asylum support "housed" when the number accommodated was zero, had never once
      # run in CI. They only ever fired for whoever happened to have a local dist, and a
      # stale one at that. Running them here is the whole point of having them.
      # No GitHub event data is interpolated here.
      # The run-on guard belongs here for the same reason: it reads dist and the defect
      # it looks for is created by the compiler, so it cannot be seen before the build.
      # No GitHub event data is interpolated here.
      - name: Guards that need the built site
        run: npx vitest run tests/support-vs-accommodation.test.ts tests/rendered-text-runons.test.ts
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile
      - run: npm run test:desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
      # Before the upload, because this compares the sitemap just built against the one
      # the live site is still serving, and submits only the URLs that are new or whose
      # lastmod moved. After the deploy that comparison is against itself and reports
      # nothing. Notifying a minute before the content lands is fine: IndexNow queues.
      # Only runs on a push to main, so a workflow_dispatch rehearsal announces nothing.
      # No GitHub event data is interpolated here.
      # continue-on-error because telling a search engine about a change is an
      # optimisation and the deploy is not. This step failing once already held the
      # whole site back from going live, which is the wrong trade in every case.
      - name: Notify IndexNow of changed canonical URLs
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        env:
          INDEXNOW_SUBMIT: "1"
        run: node scripts/indexnow-submit.mjs --changed

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
